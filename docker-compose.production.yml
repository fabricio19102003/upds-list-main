name: aulas-upds
services:
  app:
    image: aulas-upds:${RELEASE_TAG:-local}
    build: .
    restart: unless-stopped
    user: "${RUNTIME_UID:?RUNTIME_UID must be set by deploy/deploy.sh}:${RUNTIME_GID:?RUNTIME_GID must be set by deploy/deploy.sh}"
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      options: { max-size: 10m, max-file: "3" }
